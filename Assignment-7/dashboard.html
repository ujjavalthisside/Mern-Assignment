<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>

    <div class="dashboard">
        
        <header>
            <span class="logo-text">HEADER / STUDENT DASHBOARD</span>
            <nav class="nav-links">
                <a href="#">Home</a>
                <a href="#">About</a>
                <a href="#">Services</a>
                <a href="#">Contact</a>
            </nav>
        </header>

        
        <aside>
            <h3>SIDEBAR</h3>
            <ul>
                <li>Overview</li>
                <li>Courses</li>
                <li>Assignments</li>
                <li>Settings</li>
            </ul>
        </aside>

       
        <main>
            <h3>MAIN / Learning overview</h3>
            <div class="cards">
                <div class="card-box">
                    <h4>HTML</h4>
                    <p>8 lessons</p>
                </div>
                <div class="card-box">
                    <h4>CSS</h4>
                    <p>12 lessons</p>
                </div>
                <div class="card-box">
                    <h4>Projects</h4>
                    <p>3 active</p>
                </div>
            </div>
            <p class="activity-text">Your learning activity appears here.</p>
        </main>

        
        <footer>
            <span>FOOTER / CAMPUS LEARNING PORTAL</span>
            <nav class="nav-links">
                <a href="#">Home</a>
                <a href="#">About</a>
                <a href="#">Services</a>
                <a href="#">Contact</a>
            </nav>
        </footer>
    </div>

</body>
</html>
